name: Kalender aktualisieren

on:
  schedule:
    - cron: "0 4 * * *"   # täglich ca. 5/6 Uhr Berliner Zeit
  workflow_dispatch:       # manuell auslösbar
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Mit-Vergnügen-Auswertungen von früheren Läufen wiederverwenden,
      # damit jeder Artikel nur einmal an Claude geht.
      - uses: actions/cache@v4
        with:
          path: cache
          key: mv-cache-${{ github.run_id }}
          restore-keys: mv-cache-
      - run: python -m berlin_guide --out site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTEREST_PROFILE: ${{ secrets.INTEREST_PROFILE }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          PRIVATE_SOURCES: ${{ secrets.PRIVATE_SOURCES }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
