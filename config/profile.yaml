# Dein Interessenprofil. Phase 1: einfache Stichwort-Zuordnung.
# Phase 2: Claude nutzt dieses Profil zum Kuratieren.

horizon_days: 30

# Persönlicher Feed: nur Events ab dieser Claude-Bewertung (0–10).
# Das Interessenprofil selbst ist privat: lokal config/interests.md, auf GitHub Secret INTEREST_PROFILE.
min_score: 8

# Obergrenze für Claude-Kosten pro Tag (alle Läufe zusammen). Auslesen max. 70 % davon,
# der Rest bleibt fürs Bewerten. Liegengebliebenes wird am nächsten Tag nachgeholt.
claude_budget_per_day_usd: 0.82   # ≈ 0,75 € pro Tag (harte Obergrenze); was nicht reinpasst, wird nachgeholt

categories:
  musik_clubs:
    label: "Konzerte & Clubs"
    keywords: [rave, techno, house music, dj, clubbing, club night, konzert, concert, live, gig, party, festival, jazz, band, open decks]
  tech:
    label: "Tech, Startup & Meetups"
    keywords: [ai, " ki ", startup, founder, gründer, tech, product, hackathon, meetup, developer, data, vc, investor, networking, web3, demo day, builders]
  kultur:
    label: "Kultur & Ausstellungen"
    keywords: [ausstellung, exhibition, gallery, galerie, art, kunst, museum, lesung, reading, film, kino, screening, theater, theatre, poetry, vernissage, talk]
  food_draussen:
    label: "Food, Märkte & Draußen"
    keywords: [food, wine, wein, dinner, brunch, supper, markt, market, glühwein, flohmarkt, kochen, cooking, tasting, run club, running, walk, hike, outdoor, picnic, coffee]

# Events mit diesen Begriffen ausblenden
exclude_keywords: []

# Öffentliche Magazine: Seiten per Sitemap/RSS, Claude extrahiert die Termine.
web_sources:
  - name: The Berliner
    sitemap: https://www.the-berliner.com/sitemap_index.xml
    max_age_days: 7
    include: [/berlin/, /events/, /guides/, /food/, /music-clubs/, /art/, /film/, /stage/]
    exclude: [photo-of-the-week, where-to-buy, /partnership/, interview]
    max_pages: 6
  - name: iHeartBerlin
    rss: https://www.iheartberlin.de/feed/
    max_age_days: 30
